server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular uses hash routes, so missing files never need an HTML fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /assets/config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
