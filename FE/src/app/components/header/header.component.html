<header class="app-header">
  <a routerLink="/dashboard" class="brand" aria-label="Sailing dashboard">
    <img src="assets/logos/polimisailing.png" alt="Polimi Sailing Team" />
    <span>Sailing monitor</span>
  </a>
  <nav aria-label="Main navigation">
    <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
    @if (isAdmin()) {
      <a routerLink="/map" routerLinkActive="active" ariaCurrentWhenActive="page">Map</a>
    }
  </nav>
  <div class="session">
    <span class="connection" [class.connected]="connected()" role="status" data-testid="connection-status">
      <span class="status-dot" aria-hidden="true"></span>
      MQTT: {{ connection().status }}
    </span>
    <span class="role">{{ isAdmin() ? 'Operator' : 'Guest' }}</span>
    <button type="button" (click)="logout.emit()">Log out</button>
  </div>
</header>
