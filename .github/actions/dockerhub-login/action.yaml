name: Docker Hub login with bounded retries
description: Authenticate before image downloads, allowing three attempts with backoff.
inputs:
  username:
    description: Docker ID
    required: true
  password:
    description: Read-only Docker Hub access token
    required: true
runs:
  using: composite
  steps:
    - name: Login attempt 1
      id: first
      continue-on-error: true
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Wait before second attempt
      if: steps.first.outcome == 'failure'
      shell: bash
      run: sleep 15
    - name: Login attempt 2
      id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Wait before final attempt
      if: steps.second.outcome == 'failure'
      shell: bash
      run: sleep 30
    # The final failure must block the job; do not continue anonymously.
    - name: Login attempt 3
      if: steps.second.outcome == 'failure'
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
