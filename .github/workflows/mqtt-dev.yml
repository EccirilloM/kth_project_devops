name: MQTT emulator (dev)

on:
  push:
    branches: [dev]
    paths:
      - 'simulator/**'
      - '.github/workflows/mqtt-dev.yml'
  workflow_dispatch:

concurrency:
  group: mqtt-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  EMULATOR_IMAGE: mqtt-emulator
  MOSQUITTO_IMAGE: mqtt-mosquitto

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      emulator_image: ${{ steps.image.outputs.emulator }}
      mosquitto_image: ${{ steps.image.outputs.mosquitto }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Simulator unit tests
        working-directory: simulator
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if compgen -G 'test/**/*.test.ts' > /dev/null; then
            npm test
          else
            echo 'No simulator unit tests under test/; skipping'
          fi

      - name: Set image references
        id: image
        run: |
          owner_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "emulator=${{ env.REGISTRY }}/${owner_repo}/${{ env.EMULATOR_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "mosquitto=${{ env.REGISTRY }}/${owner_repo}/${{ env.MOSQUITTO_IMAGE }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push emulator (amd64)
        uses: docker/build-push-action@v6
        with:
          context: simulator
          file: simulator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.emulator }}:${{ github.sha }}
            ${{ steps.image.outputs.emulator }}:latest

      - name: Build and push mosquitto (amd64)
        uses: docker/build-push-action@v6
        with:
          context: simulator
          file: simulator/Dockerfile.mosquitto
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.mosquitto }}:${{ github.sha }}
            ${{ steps.image.outputs.mosquitto }}:latest

  deploy:
    needs: test-and-push
    runs-on: ubuntu-latest
    environment: mqtt-dev
    permissions:
      contents: read
    steps:
      - name: Require deploy settings
        env:
          APP_ID: ${{ vars.APP_ID }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          missing=
          for name in APP_ID DIGITALOCEAN_ACCESS_TOKEN; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "Missing required setting: $name"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            echo "Configure Environment mqtt-dev (see workflow header)."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Redeploy App Platform app
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: |
          set -euo pipefail
          doctl apps create-deployment "$APP_ID" --wait
          echo "Deployed emulator=${{ needs.test-and-push.outputs.emulator_image }}:${{ github.sha }}"
          echo "Deployed mosquitto=${{ needs.test-and-push.outputs.mosquitto_image }}:${{ github.sha }}"
