# Build MQTT images and push to DigitalOcean Container Registry.
# App Platform redeploys automatically (deploy_on_push on DOCR) — no manual
# doctl apps create-deployment needed.
#
# GitHub Environment: mqtt-dev
#
# Required variables:
#   DOCR_REGISTRY — terraform output registry_name
#
# Required secrets:
#   DIGITALOCEAN_ACCESS_TOKEN — doctl auth (registry login + push)
#
# Images (linux/amd64) pushed to:
#   registry.digitalocean.com/<DOCR_REGISTRY>/mqtt-emulator:<sha|:latest>
#   registry.digitalocean.com/<DOCR_REGISTRY>/mqtt-mosquitto:<sha|:latest>

name: MQTT emulator (dev)

on:
  push:
    branches: [dev]
    paths:
      - 'simulator/**'
      - '.github/workflows/mqtt-dev.yml'
  workflow_dispatch:

concurrency:
  group: mqtt-dev
  cancel-in-progress: false

env:
  EMULATOR_IMAGE: mqtt-emulator
  MOSQUITTO_IMAGE: mqtt-mosquitto

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    environment: mqtt-dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Simulator unit tests
        working-directory: simulator
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if compgen -G 'test/**/*.test.ts' > /dev/null || compgen -G 'test/**/*.test.mjs' > /dev/null; then
            npm test
          else
            echo 'No simulator unit tests under test/; skipping'
          fi

      - name: Require DOCR settings
        env:
          DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          missing=
          for name in DOCR_REGISTRY DIGITALOCEAN_ACCESS_TOKEN; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "Missing required setting: $name"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            echo "Configure Environment mqtt-dev (see workflow header / infra/README.md)."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image refs
        id: image
        env:
          DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
        run: |
          endpoint=$(doctl registry get --format Endpoint --no-header)
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "emulator=$endpoint/${DOCR_REGISTRY}/${{ env.EMULATOR_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "mosquitto=$endpoint/${DOCR_REGISTRY}/${{ env.MOSQUITTO_IMAGE }}" >> "$GITHUB_OUTPUT"

      - name: Build and push emulator (amd64)
        uses: docker/build-push-action@v6
        with:
          context: simulator
          file: simulator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.emulator }}:${{ github.sha }}
            ${{ steps.image.outputs.emulator }}:latest

      - name: Build and push mosquitto (amd64)
        uses: docker/build-push-action@v6
        with:
          context: simulator
          file: simulator/Dockerfile.mosquitto
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.mosquitto }}:${{ github.sha }}
            ${{ steps.image.outputs.mosquitto }}:latest

      - name: Done
        run: |
          echo "Pushed ${{ steps.image.outputs.emulator }}:latest"
          echo "Pushed ${{ steps.image.outputs.mosquitto }}:latest"
          echo "App Platform will auto-redeploy via DOCR deploy_on_push."
