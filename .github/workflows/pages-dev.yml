name: Dev GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'FE/**'
      - '.github/workflows/pages-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: mqtt-dev
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require Pages settings
        env:
          MQTT_BROKER_URL: ${{ vars.MQTT_BROKER_URL }}
          DEV_PAGES_REPO: ${{ vars.DEV_PAGES_REPO }}
          DEV_PAGES_TOKEN: ${{ secrets.DEV_PAGES_TOKEN }}
        working-directory: .
        run: |
          missing=
          for name in MQTT_BROKER_URL DEV_PAGES_REPO DEV_PAGES_TOKEN; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "Missing required setting: $name"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            echo "Configure Environment mqtt-dev (see workflow header)."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Protocol tests
        run: npm test

      - name: Type check protocol and tests
        run: npm run test:types

      - name: Build static site
        run: npm run build -- --base-href ./

      - name: Write runtime config.json for Pages
        working-directory: FE/dist/sail-monitoring-web/browser
        env:
          MQTT_BROKER_URL: ${{ vars.MQTT_BROKER_URL }}
          MQTT_CONNECT_TIMEOUT_MS: ${{ vars.MQTT_CONNECT_TIMEOUT_MS }}
          MQTT_RECONNECT_MS: ${{ vars.MQTT_RECONNECT_MS }}
          MQTT_DATA_TIMEOUT_MS: ${{ vars.MQTT_DATA_TIMEOUT_MS }}
          MQTT_DIAGNOSTIC_TIMEOUT_MS: ${{ vars.MQTT_DIAGNOSTIC_TIMEOUT_MS }}
          MQTT_RECORDING_TIMEOUT_MS: ${{ vars.MQTT_RECORDING_TIMEOUT_MS }}
          MQTT_COMMAND_TIMEOUT_MS: ${{ vars.MQTT_COMMAND_TIMEOUT_MS }}
          MQTT_MAX_PAYLOAD_BYTES: ${{ vars.MQTT_MAX_PAYLOAD_BYTES }}
        run: |
          set -euo pipefail
          case "$MQTT_BROKER_URL" in
            wss://*) ;;
            *)
              echo "MQTT_BROKER_URL must be a wss:// URL (got: $MQTT_BROKER_URL)"
              exit 1
              ;;
          esac
          node <<'NODE'
          const fs = require('fs');
          const path = 'config.json';
          const base = fs.existsSync(path)
            ? JSON.parse(fs.readFileSync(path, 'utf8'))
            : {};
          const users = base.users && typeof base.users === 'object' && !Array.isArray(base.users)
            ? base.users
            : {
                guest: 'GUEST',
                Guest: 'GUEST',
                operator: 'ADMIN',
                Staff: 'ADMIN',
                staff: 'ADMIN',
              };
          const intOr = (raw, fallback) => {
            if (raw === undefined || raw === null || String(raw).trim() === '') return fallback;
            const n = Number(raw);
            if (!Number.isInteger(n) || n <= 0) {
              throw new Error(`Invalid positive integer: ${raw}`);
            }
            return n;
          };
          const out = {
            brokerUrl: process.env.MQTT_BROKER_URL,
            users,
            connectTimeoutMs: intOr(process.env.MQTT_CONNECT_TIMEOUT_MS, base.connectTimeoutMs ?? 12000),
            reconnectMs: intOr(process.env.MQTT_RECONNECT_MS, base.reconnectMs ?? 5000),
            dataTimeoutMs: intOr(process.env.MQTT_DATA_TIMEOUT_MS, base.dataTimeoutMs ?? 5000),
            diagnosticTimeoutMs: intOr(process.env.MQTT_DIAGNOSTIC_TIMEOUT_MS, base.diagnosticTimeoutMs ?? 15000),
            recordingTimeoutMs: intOr(process.env.MQTT_RECORDING_TIMEOUT_MS, base.recordingTimeoutMs ?? 5000),
            commandTimeoutMs: intOr(process.env.MQTT_COMMAND_TIMEOUT_MS, base.commandTimeoutMs ?? 10000),
            maxPayloadBytes: intOr(process.env.MQTT_MAX_PAYLOAD_BYTES, base.maxPayloadBytes ?? 65536),
          };
          fs.writeFileSync(path, `${JSON.stringify(out, null, 2)}\n`);
          console.log(`Wrote ${path} brokerUrl=${out.brokerUrl}`);
          NODE

      - name: Publish to dedicated Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEV_PAGES_TOKEN }}
          external_repository: ${{ vars.DEV_PAGES_REPO }}
          publish_dir: FE/dist/sail-monitoring-web/browser
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'dev pages ${{ github.sha }}'
