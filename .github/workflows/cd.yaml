name: CD

on:
  workflow_call:
    inputs:
      integration-passed:
        description: Whether real MQTT integration and Terraform checks passed in the calling CI run
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  simulator-publish:
    name: Publish tested simulator candidate to GHCR
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      vars.GHCR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/ghcr-auth
      SIMULATOR_IMAGE: kth-devops-simulator:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulator-image-${{ github.sha }}
          path: ${{ runner.temp }}/simulator-image
      - name: Load and verify the previously tested image
        working-directory: ${{ runner.temp }}/simulator-image
        run: |
          sha256sum --check image.sha256
          docker load --input image.tar
          test "$(docker image inspect "$SIMULATOR_IMAGE" --format '{{.Id}}')" = "$(cat image.id)"
          test "$(docker image inspect "$SIMULATOR_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$SIMULATOR_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - name: Authenticate with the repository token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish commit tag and record the immutable pull reference
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/simulator"
          tag="$image:sha-$GITHUB_SHA"
          docker tag "$SIMULATOR_IMAGE" "$tag"
          docker push "$tag"
          reference=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$image@sha256:")
          [[ "$reference" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/simulator-release"
          printf 'GHCR_IMAGE=%s\n' "$reference" > "$RUNNER_TEMP/simulator-release/image.env"
          {
            echo '### Simulator image published'
            printf '\nCommit: %s\n\nPlatform: linux/amd64\n' "$GITHUB_SHA"
            printf '\nTag: %s\n\nGHCR_IMAGE=%s\n' "$tag" "$reference"
            echo
            echo 'This candidate passed model tests and dependency/security gates; it is not evidence of real MQTT integration or Droplet deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Store the simulator pull reference
        uses: actions/upload-artifact@v4
        with:
          name: simulator-release-${{ github.sha }}
          path: ${{ runner.temp }}/simulator-release/image.env
          if-no-files-found: error
          retention-days: 14
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io

  delivery:
    name: Package frontend delivery candidate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-checked-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/
      - name: Verify that delivery reuses the tested files
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }}/FE,target=/app/FE,readonly"
          --workdir /app/FE node:24-bookworm-slim
          node scripts/artifact.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-delivery-candidate-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/
          if-no-files-found: error
          retention-days: 14

  pages-package:
    name: Prepare validated Pages artifact
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' && inputs.integration-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-checked-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/
      - name: Supply public settings without rebuilding the frontend
        env:
          KTH_PUBLIC_CONFIG: ${{ vars.PAGES_PUBLIC_CONFIG_JSON }}
        run: >-
          docker run --rm --env KTH_PUBLIC_CONFIG
          --mount "type=bind,source=${{ github.workspace }}/FE,target=/app/FE"
          --workdir /app/FE node:24-bookworm-slim
          node --experimental-transform-types --import ./tests/register.mjs
          scripts/prepare-delivery.mjs --env
      - uses: actions/upload-pages-artifact@v4
        with:
          path: FE/dist/sail-monitoring-web/browser/

  deploy:
    name: Deploy validated frontend to GitHub Pages
    needs: [pages-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
