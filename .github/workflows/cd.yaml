name: CD

on:
  workflow_call:
    inputs:
      integration-passed:
        description: Whether real MQTT integration and Terraform checks passed in the calling CI run
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  # Dev images are pushed to DOCR in the "dev" job (not GHCR).

  delivery:
    name: Package frontend delivery candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-checked-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/
      - name: Verify that delivery reuses the tested files
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }}/FE,target=/app/FE,readonly"
          --workdir /app/FE node:24-bookworm-slim
          node scripts/artifact.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-delivery-candidate-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/
          if-no-files-found: error
          retention-days: 14

  pages-package:
    name: Prepare validated Pages artifact
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' && inputs.integration-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-checked-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/
      - name: Supply public settings without rebuilding the frontend
        env:
          KTH_PUBLIC_CONFIG: ${{ vars.PAGES_PUBLIC_CONFIG_JSON }}
        run: >-
          docker run --rm --env KTH_PUBLIC_CONFIG
          --mount "type=bind,source=${{ github.workspace }}/FE,target=/app/FE"
          --workdir /app/FE node:24-bookworm-slim
          node --experimental-transform-types --import ./tests/register.mjs
          scripts/prepare-delivery.mjs --env
      - uses: actions/upload-pages-artifact@v4
        with:
          path: FE/dist/sail-monitoring-web/browser/

  deploy:
    name: Deploy validated frontend to GitHub Pages
    needs: [pages-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4

  dev:
    name: Deploy DigitalOcean App Platform (dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: mqtt-dev-app
      cancel-in-progress: false
    env:
      IMAGE_REPOSITORY: mqtt
      TF_IN_AUTOMATION: 'true'
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DIGITALOCEAN_TOKEN }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DIGITALOCEAN_TOKEN }}
      SIMULATOR_IMAGE: kth-devops-simulator:${{ github.sha }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require DO token
        working-directory: .
        run: |
          if [ -z "${DIGITALOCEAN_ACCESS_TOKEN:-}" ]; then
            echo "::error::Add repository secret DIGITALOCEAN_ACCESS_TOKEN"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: frontend-checked-${{ github.sha }}
          path: FE/dist/sail-monitoring-web/browser/

      - uses: actions/download-artifact@v4
        with:
          name: simulator-image-${{ github.sha }}
          path: ${{ runner.temp }}/simulator-image

      - name: Load tested simulator image
        working-directory: ${{ runner.temp }}/simulator-image
        run: |
          sha256sum --check image.sha256
          docker load --input image.tar
          test "$(docker image inspect "$SIMULATOR_IMAGE" --format '{{.Id}}')" = "$(cat image.id)"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Restore terraform state
        uses: actions/cache/restore@v4
        with:
          path: infra/terraform.tfstate
          key: mqtt-dev-tfstate-${{ github.ref_name }}
          restore-keys: |
            mqtt-dev-tfstate-${{ github.ref_name }}
            mqtt-dev-tfstate-

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform vars from GitHub
        working-directory: .
        run: |
          [[ -n "${{ vars.TF_REGION }}" ]] && echo "TF_VAR_region=${{ vars.TF_REGION }}" >> "$GITHUB_ENV"
          [[ -n "${{ vars.TF_REGISTRY_NAME }}" ]] && echo "TF_VAR_registry_name=${{ vars.TF_REGISTRY_NAME }}" >> "$GITHUB_ENV"
          [[ -n "${{ vars.TF_DOMAIN }}" ]] && echo "TF_VAR_domain=${{ vars.TF_DOMAIN }}" >> "$GITHUB_ENV"
          [[ -n "${{ vars.TF_ZONE }}" ]] && echo "TF_VAR_zone=${{ vars.TF_ZONE }}" >> "$GITHUB_ENV"
          [[ -n "${{ vars.TF_PROJECT_NAME }}" ]] && echo "TF_VAR_project_name=${{ vars.TF_PROJECT_NAME }}" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.SIMULATOR_PASSWORD }}" ]; then
            echo "TF_VAR_simulator_password=${{ secrets.SIMULATOR_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Adopt existing registry if needed
        run: |
          set -euo pipefail
          if terraform state list 2>/dev/null | grep -qx 'digitalocean_container_registry.mqtt'; then
            exit 0
          fi
          name="$(doctl registry get --format Name --no-header 2>/dev/null || true)"
          if [ -n "$name" ]; then
            terraform import -input=false digitalocean_container_registry.mqtt "$name"
          fi

      - name: Terraform — registry
        run: terraform apply -input=false -auto-approve -target=digitalocean_container_registry.mqtt

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1800

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        id: image
        working-directory: .
        run: |
          set -euo pipefail
          endpoint=$(doctl registry get --format Endpoint --no-header | tr -d '[:space:]')
          existing="$(doctl registry repository list -o json 2>/dev/null | jq -r '.[0].name // empty' || true)"
          repo_name="${existing:-$IMAGE_REPOSITORY}"
          case "$repo_name" in
            *[!a-zA-Z0-9._-]*|"") repo_name="$IMAGE_REPOSITORY" ;;
          esac
          image="$endpoint/$repo_name"
          echo "Using DOCR repository: $repo_name"
          echo "TF_VAR_image_repository=$repo_name" >> "$GITHUB_ENV"

          docker tag "$SIMULATOR_IMAGE" "${image}:simulator"
          docker tag "$SIMULATOR_IMAGE" "${image}:simulator-${GITHUB_SHA}"
          docker push "${image}:simulator"
          docker push "${image}:simulator-${GITHUB_SHA}"

          build_flags=(--platform linux/amd64 --provenance=false --sbom=false --push)
          docker buildx build "${build_flags[@]}" \
            -f simulator/Dockerfile.mosquitto \
            -t "${image}:mosquitto" -t "${image}:mosquitto-${GITHUB_SHA}" \
            simulator

          fe_ctx="$RUNNER_TEMP/fe-runtime"
          mkdir -p "$fe_ctx"
          cp FE/nginx.default.conf FE/docker-entrypoint.sh "$fe_ctx/"
          cp -a FE/dist/sail-monitoring-web/browser/. "$fe_ctx/"
          cat >"$fe_ctx/Dockerfile" <<'EOF'
          FROM nginx:1.27-alpine
          COPY nginx.default.conf /etc/nginx/conf.d/default.conf
          COPY docker-entrypoint.sh /docker-entrypoint.sh
          RUN chmod +x /docker-entrypoint.sh
          COPY . /usr/share/nginx/html
          EXPOSE 80
          ENTRYPOINT ["/docker-entrypoint.sh"]
          EOF
          docker buildx build "${build_flags[@]}" \
            -t "${image}:frontend" -t "${image}:frontend-${GITHUB_SHA}" \
            "$fe_ctx"

          tags_json="$(doctl registry repository list-tags "$repo_name" -o json)"
          echo "$tags_json" | jq '[.[].tag // .[].Tag]'
          for t in simulator mosquitto frontend; do
            echo "$tags_json" | jq -e --arg t "$t" '[.[].tag // .[].Tag] | index($t)' >/dev/null \
              || { echo "missing tag: $t"; exit 1; }
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Adopt existing app if needed
        run: |
          set -euo pipefail
          if terraform state list 2>/dev/null | grep -qx 'digitalocean_app.mqtt'; then
            exit 0
          fi
          id="$(doctl apps list --format ID,Spec.Name --no-header 2>/dev/null | awk '$2=="mqtt-emulator"{print $1; exit}')"
          if [ -n "$id" ]; then
            terraform import -input=false digitalocean_app.mqtt "$id"
          fi

      - name: Terraform — app
        run: terraform apply -input=false -auto-approve

      - name: Save terraform state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: infra/terraform.tfstate
          key: mqtt-dev-tfstate-${{ github.ref_name }}-${{ github.run_id }}

      - name: Summary
        run: |
          {
            echo "### Dev App Platform"
            echo ""
            echo "- UI: \`$(terraform output -raw app_url)\`"
            echo "- broker: \`$(terraform output -raw broker_wss_url)\`"
            echo "- images: \`${{ steps.image.outputs.image }}:{frontend,mosquitto,simulator}\`"
          } >> "$GITHUB_STEP_SUMMARY"
