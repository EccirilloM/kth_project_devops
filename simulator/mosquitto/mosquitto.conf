# Lab Mosquitto: MQTT TCP (internal) + WebSockets (Caddy → WSS)
persistence false
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl

# Emulator and compose-internal clients
listener 1883
protocol mqtt
allow_anonymous false

# WebSocket listener — only reachable on the Docker network; Caddy terminates TLS
listener 9001
protocol websockets
allow_anonymous false
